<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Rapids White Water Rafting</title>
    <meta name="description" content="Our contact information.">
    <meta name="author" content="Sean Wood">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.png" alt="Rapids White Water Rafting Logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <address>
            <h2>Rapids White Water Rafting</h2>
            <p>7200 NW Front Ave</p>
            <p>Portland, Oregon</p>
            <p>+1 999 999 9999</p>
            <p>info@rapidsrafting.com</p>
        </address>
        <div class="contact">
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1974.7495029224779!2d-122.75086548162143!3d45.5761186977834!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x5495081b198e65a5%3A0x8febc81bf42739ff!2s7200%20NW%20Front%20Ave%2C%20Portland%2C%20OR%2097210!5e0!3m2!1sen!2sus!4v1775161054122!5m2!1sen!2sus"
                width="600" height="450" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
            </iframe>
            <form>
                <div class="formitem column1">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="John Doe">
                </div>
                <div class="formitem column1">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="name@example.com">
                </div>
                <div class="select">
                    <p>Message Purpose</p>
                    <div class="formitem column2">
                        <input type="radio" id="purpose1" name="purpose1">
                        <label for="purpose1">General Inquiry</label>
                        <input type="radio" id="purpose2" name="purpose2">
                        <label for="purpose2">Reservation Question</label>
                        <input type="radio" id="purpose3" name="purpose3">
                        <label for="purpose3">Website Suggestion</label>
                    </div>
                </div> <!--select-->
                <div class="formitem">
                    <label for="message">Message</label>
                    <textarea id="message" placeholder="Type here"></textarea>
                </div>
                <div class="column3">
                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label id="newsletter">Please subscribe me to the monthly newsletter</label>
                </div>
                <button id="submit">Send Message</button>
            </form>
        </div> <!--contact-->
        <div class="serve">
            <h2>We Are Here to Serve You</h2>
            <div class="employees">
                <figure>
                    <img src="images/employees/george-thomas.jpg">
                    <figcaption>George Thomas</figcaption>
                </figure>
                <figure>
                    <img src="images/employees/amanda-barnett.jpg">
                    <figcaption>Amanda Barnett</figcaption>
                </figure>
                <figure>
                    <img src="images/employees/jeffrey-shaw.jpg">
                    <figcaption>Jeffrey Shaw</figcaption>
                </figure>
            </div>
        </div>
    </main>
    <footer>
        <p>&COPY; 2026 | Rapids White Water Rafting | Sean Wood</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook icon">
            </a>
            <a href="https://x.com">
                <img src="images/x-bw.svg" alt="X social media icon">
            </a>
            <a href="https://youtube.com">
                <img src="images/youtube.svg" alt="Youtube icon">
            </a>
        </nav>
    </footer>
</body>

</html>
